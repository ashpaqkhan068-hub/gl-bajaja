{% extends 'base.html' %}
{% block title %}400 Bad Request — KaamNearby{% endblock %}
{% block content %}
<div class="container py-16 text-center" style="max-width: 560px;">
  <div style="font-size: 4rem; font-weight: 900; color: var(--color-error); line-height: 1;">400</div>
  <h1 class="text-2xl font-bold mt-4 mb-2">Bad Request</h1>
  <p class="text-muted mb-6">{{ error.description if error and error.description else 'The request was invalid or could not be processed.' }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
