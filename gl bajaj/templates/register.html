{% extends 'base.html' %}

{% block title %}Create an Account — KaamNearby{% endblock %}

{% block content %}
<div class="container py-12" style="max-width: 620px;">
  <div class="form-card">
    <div class="text-center mb-6">
      <div class="brand-icon-box mx-auto mb-3" style="margin: 0 auto 0.75rem;">K</div>
      <h1 class="text-2xl font-bold">Join KaamNearby</h1>
      <p class="text-muted text-sm">Sign up as a household customer or a skilled service professional</p>
    </div>

    <!-- Account Role Selection Tabs -->
    <div class="flex gap-2 mb-6" style="background: var(--bg-subtle); padding: 4px; border-radius: var(--radius-md);">
      <button type="button" id="roleBtnCustomer" class="btn btn-sm btn-block {{ 'btn-primary' if form.get('role', request.args.get('role', 'customer')) != 'worker' else 'btn-outline' }}" style="border:none;">
        <i data-lucide="user" style="width: 16px; height: 16px;"></i> I Need Home Services (Customer)
      </button>
      <button type="button" id="roleBtnWorker" class="btn btn-sm btn-block {{ 'btn-teal' if form.get('role', request.args.get('role', 'customer')) == 'worker' else 'btn-outline' }}" style="border:none;">
        <i data-lucide="hard-hat" style="width: 16px; height: 16px;"></i> I Provide Services (Worker)
      </button>
    </div>

    <form action="{{ url_for('register') }}" method="POST" id="registerForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="role" id="roleInput" value="{{ form.get('role', request.args.get('role', 'customer')) }}">

      <div class="grid grid-cols-2 gap-3">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Ramesh Sharma" value="{{ form.get('name', '') }}" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. 9812345678" value="{{ form.get('phone', '') }}">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ form.get('email', '') }}" required>
        </div>
        <div class="form-group">
          <label for="city">City / Locality *</label>
          <input type="text" id="city" name="city" class="form-control" placeholder="e.g. Greater Noida" value="{{ form.get('city', '') }}" required>
        </div>
      </div>

      <!-- Worker Specific Fields (shown when Worker selected) -->
      <div id="workerFields" style="display: {{ 'block' if form.get('role', request.args.get('role', 'customer')) == 'worker' else 'none' }}; border-top: 1px dashed var(--border-color); padding-top: 1rem; margin-top: 0.5rem;">
        <div class="grid grid-cols-2 gap-3">
          <div class="form-group">
            <label for="category">Primary Trade Category *</label>
            <select id="category" name="category" class="form-control">
              <option value="">Select Service Category</option>
              {% for cat in categories %}
                <option value="{{ cat.name }}" {{ 'selected' if form.get('category') == cat.name else '' }}>{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="starting_price">Starting Price (₹) *</label>
            <input type="number" id="starting_price" name="starting_price" class="form-control" placeholder="300" min="50" value="{{ form.get('starting_price', '350') }}">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="form-group">
            <label for="experience_years">Years of Experience</label>
            <input type="number" id="experience_years" name="experience_years" class="form-control" min="0" value="{{ form.get('experience_years', '3') }}">
          </div>
          <div class="form-group">
            <label for="service_area">Service Areas Covered</label>
            <input type="text" id="service_area" name="service_area" class="form-control" placeholder="e.g. Pari Chowk, Sector 62, Delta 1" value="{{ form.get('service_area', '') }}">
          </div>
        </div>

        <div class="form-group">
          <label for="bio">Professional Experience & Bio</label>
          <textarea id="bio" name="bio" rows="2" class="form-control" placeholder="Describe your trade background, certifications, and types of repairs you handle...">{{ form.get('bio', '') }}</textarea>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="form-group">
          <label for="password">Password (min 8 characters) *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="8" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="8" required>
        </div>
      </div>

      <div class="form-group mb-4">
        <label class="flex items-center gap-2" style="font-weight: 400; font-size: 0.85rem; cursor: pointer;">
          <input type="checkbox" name="agree_terms" value="1" required checked>
          <span>I agree to the <a href="{{ url_for('terms') }}" target="_blank">Terms of Service</a> and <a href="{{ url_for('privacy') }}" target="_blank">Privacy Policy</a>.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        Complete Registration
      </button>
    </form>

    <div class="text-center mt-6 text-sm text-muted">
      Already have an account? <a href="{{ url_for('login') }}" class="font-bold">Log In</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const roleBtnCustomer = document.getElementById('roleBtnCustomer');
    const roleBtnWorker = document.getElementById('roleBtnWorker');
    const roleInput = document.getElementById('roleInput');
    const workerFields = document.getElementById('workerFields');
    const submitBtn = document.getElementById('submitBtn');

    function setRole(role) {
      roleInput.value = role;
      if (role === 'worker') {
        roleBtnWorker.className = 'btn btn-sm btn-block btn-teal';
        roleBtnCustomer.className = 'btn btn-sm btn-block btn-outline';
        workerFields.style.display = 'block';
        submitBtn.className = 'btn btn-teal btn-block btn-lg';
        submitBtn.textContent = 'Register as Service Worker';
      } else {
        roleBtnCustomer.className = 'btn btn-sm btn-block btn-primary';
        roleBtnWorker.className = 'btn btn-sm btn-block btn-outline';
        workerFields.style.display = 'none';
        submitBtn.className = 'btn btn-primary btn-block btn-lg';
        submitBtn.textContent = 'Create Customer Account';
      }
    }

    roleBtnCustomer.addEventListener('click', () => setRole('customer'));
    roleBtnWorker.addEventListener('click', () => setRole('worker'));

    // Initialize from current role
    setRole(roleInput.value || 'customer');
  });
</script>
{% endblock %}
